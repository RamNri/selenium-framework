[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts = -m "not artifact_validation"

markers =
    artifact_validation: intentional failure test used to validate the failure artifact pipeline
    smoke: Critical tests that validate the core application functionality
    regression: Full regression test suite
    ui: UI automation tests
    api: API automation tests
    integration: Integration tests
    slow: Tests that take relatively longer to execute